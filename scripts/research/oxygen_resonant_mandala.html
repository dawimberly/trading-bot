<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxygen (Z=8) — 2D Resonant Disc Morphology</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030308;
      color: #9ec8e8;
      font-family: "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #c8e4ff;
    }
    .subtitle {
      font-size: 0.78rem;
      opacity: 0.65;
      margin-bottom: 18px;
      text-align: center;
      max-width: 640px;
      line-height: 1.5;
    }
    canvas {
      display: block;
      max-width: min(92vw, 820px);
      height: auto;
      border: 1px solid rgba(120, 180, 230, 0.15);
      box-shadow: 0 0 80px rgba(40, 120, 200, 0.12);
    }
    .meta {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.72rem;
      opacity: 0.55;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <h1>Oxygen — 2D Resonant Disc Morphology</h1>
  <p class="subtitle">
    Static superposition: &rho;<sub>total</sub> = |&psi;<sub>1s</sub>|&sup2; + |&psi;<sub>2s</sub>|&sup2; + |&psi;<sub>2px</sub>|&sup2; + |&psi;<sub>2py</sub>|&sup2; + |&psi;<sub>2pz</sub>|&sup2;
    &nbsp;&middot;&nbsp; Seed of Life vesica intersections &nbsp;&middot;&nbsp; Z=8 / 6 valence
  </p>
  <canvas id="mandala" width="900" height="900"></canvas>
  <div class="meta">
    <span>O &nbsp; Z=8</span>
    <span>1s&sup2; 2s&sup2; 2p&sup4;</span>
    <span>Period 2 &nbsp; Group 16</span>
    <span>Slater Z<sub>eff</sub>: 1s=7.70 &nbsp; 2s/2p=4.45</span>
  </div>

  <script>
    const canvas = document.getElementById("mandala");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const CX = W / 2;
    const CY = H / 2;
    const R_MAX = 380;
    const A0 = 42; // display Bohr scale

    // Slater effective nuclear charge (oxygen)
    const Z1S = 7.70;
    const Z2 = 4.45;

    function laguerre(n, alpha, x) {
      if (n === 0) return 1;
      if (n === 1) return 1 + alpha - x;
      let L0 = 1;
      let L1 = 1 + alpha - x;
      for (let k = 2; k <= n; k++) {
        const L2 = ((2 * k - 1 + alpha - x) * L1 - (k - 1 + alpha) * L0) / k;
        L0 = L1;
        L1 = L2;
      }
      return L1;
    }

    function radial(n, l, zEff, r) {
      if (r < 1e-9) r = 1e-9;
      const rho = (2 * zEff * r) / (n * A0);
      const norm = Math.sqrt(
        Math.pow((2 * zEff) / (n * A0), 3) *
        factorial(n - l - 1) / (2 * n * factorial(n + l))
      );
      const lag = laguerre(n - l - 1, 2 * l + 1, rho);
      return norm * Math.exp(-rho / 2) * Math.pow(rho, l) * lag;
    }

    function factorial(n) {
      let f = 1;
      for (let i = 2; i <= n; i++) f *= i;
      return f;
    }

    // Real 2p lobes projected onto xy disc (gyroscope intersection)
    function orbitalDensity(x, y) {
      const r = Math.hypot(x, y);
      if (r < 1e-9) {
        const core = radial(1, 0, Z1S, 0) ** 2 * 2;
        return core;
      }
      const nx = x / r;
      const ny = y / r;

      const R1s = radial(1, 0, Z1S, r);
      const R2s = radial(2, 0, Z2, r);
      const R2p = radial(2, 1, Z2, r);

      const rho1s = 2 * R1s * R1s;
      const rho2s = 2 * R2s * R2s;

      // px, py: orthogonal dumbbells in plane
      const rhoPx = 1 * R2p * R2p * nx * nx;
      const rhoPy = 2 * R2p * R2p * ny * ny;

      // pz: nodal plane in xy — projected as tilted lobe (half-filled, dimmer)
      const tilt = Math.SQRT1_2;
      const pzAxis = nx * tilt + ny * tilt;
      const rhoPz = 0.5 * R2p * R2p * pzAxis * pzAxis;

      let total = rho1s + rho2s + rhoPx + rhoPy + rhoPz;

      // Small dipole asymmetry from unpaired 2pz
      total *= 1 - 0.12 * ny * Math.exp(-Math.pow(r / (2.2 * A0), 2));

      return Math.max(0, total);
    }

    function fluidBoundary(angle) {
      return R_MAX * (
        0.94 +
        0.045 * Math.sin(5 * angle) +
        0.028 * Math.sin(8 * angle + 0.6) +
        0.018 * Math.sin(13 * angle - 1.1)
      );
    }

    function seedCenters(radius) {
      const centers = [[0, 0]];
      for (let k = 0; k < 6; k++) {
        const a = (k * Math.PI) / 3;
        centers.push([radius * Math.cos(a), radius * Math.sin(a)]);
      }
      return centers;
    }

    function densityToColor(t) {
      // black -> deep navy -> electric cyan -> white
      t = Math.max(0, Math.min(1, t));
      if (t < 0.08) {
        const u = t / 0.08;
        return [3 + 8 * u, 4 + 12 * u, 14 + 30 * u, 255 * u * 0.4];
      }
      if (t < 0.35) {
        const u = (t - 0.08) / 0.27;
        return [11 + 20 * u, 16 + 60 * u, 44 + 120 * u, 80 + 120 * u];
      }
      if (t < 0.72) {
        const u = (t - 0.35) / 0.37;
        return [31 + 40 * u, 76 + 120 * u, 164 + 60 * u, 200 + 40 * u];
      }
      const u = (t - 0.72) / 0.28;
      return [71 + 184 * u, 196 + 59 * u, 224 + 31 * u, 240 + 15 * u];
    }

    function renderDensity() {
      const image = ctx.createImageData(W, H);
      const data = image.data;
      const samples = [];
      const step = 2;

      for (let py = 0; py < H; py += step) {
        for (let px = 0; px < W; px += step) {
          const x = px - CX;
          const y = CY - py;
          const angle = Math.atan2(y, x);
          const r = Math.hypot(x, y);
          const bound = fluidBoundary(angle);
          if (r > bound) continue;

          const d = orbitalDensity(x, y);
          samples.push(d);
        }
      }

      samples.sort((a, b) => a - b);
      const vmax = samples[Math.floor(samples.length * 0.992)] || 1;

      for (let py = 0; py < H; py++) {
        for (let px = 0; px < W; px++) {
          const idx = (py * W + px) * 4;
          const x = px - CX;
          const y = CY - py;
          const angle = Math.atan2(y, x);
          const r = Math.hypot(x, y);
          const bound = fluidBoundary(angle);

          if (r > bound) {
            data[idx] = 3;
            data[idx + 1] = 3;
            data[idx + 2] = 8;
            data[idx + 3] = 255;
            continue;
          }

          const d = orbitalDensity(x, y);
          const t = Math.pow(d / vmax, 0.62);
          const [cr, cg, cb, ca] = densityToColor(t);
          data[idx] = cr;
          data[idx + 1] = cg;
          data[idx + 2] = cb;
          data[idx + 3] = ca;
        }
      }

      ctx.putImageData(image, 0, 0);
    }

    function drawSacredGeometry() {
      const shellR = 2.05 * A0 * 3.8;
      const centers = seedCenters(shellR);

      // Vesica piscis petal fills
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = 1; i < centers.length; i++) {
        for (let j = i + 1; j < centers.length; j++) {
          const [x1, y1] = centers[i];
          const [x2, y2] = centers[j];
          const mx = CX + (x1 + x2) / 2;
          const my = CY + (y1 + y2) / 2;
          const grad = ctx.createRadialGradient(mx, my, 0, mx, my, shellR * 0.42);
          grad.addColorStop(0, "rgba(120, 220, 255, 0.18)");
          grad.addColorStop(1, "rgba(20, 80, 140, 0)");
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(mx, my, shellR * 0.38, shellR * 0.22, Math.atan2(y2 - y1, x2 - x1), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // Seed of Life circles
      ctx.strokeStyle = "rgba(180, 220, 255, 0.22)";
      ctx.lineWidth = 1.1;
      for (const [cx, cy] of centers) {
        ctx.beginPath();
        ctx.arc(CX + cx, CY + cy, shellR, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Hexagram at 2p shell
      ctx.strokeStyle = "rgba(220, 160, 90, 0.42)";
      ctx.lineWidth = 1.2;
      for (const rot of [0, Math.PI]) {
        ctx.beginPath();
        for (let k = 0; k <= 6; k++) {
          const a = rot + (k * Math.PI) / 3;
          const px = CX + shellR * 1.02 * Math.cos(a);
          const py = CY + shellR * 1.02 * Math.sin(a);
          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 8-fold outer rose (Z=8)
      ctx.strokeStyle = "rgba(140, 190, 240, 0.28)";
      ctx.lineWidth = 0.8;
      const rOuter = R_MAX * 0.86;
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(CX + rOuter * Math.cos(a), CY + rOuter * Math.sin(a));
        ctx.stroke();
      }

      // Octagram ring
      ctx.beginPath();
      for (let k = 0; k <= 8; k++) {
        const a = (k * Math.PI) / 4 - Math.PI / 8;
        const px = CX + rOuter * Math.cos(a);
        const py = CY + rOuter * Math.sin(a);
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(100, 160, 220, 0.2)";
      ctx.stroke();

      // Fluid boundary
      ctx.beginPath();
      for (let k = 0; k <= 360; k++) {
        const a = (k * Math.PI) / 180;
        const rb = fluidBoundary(a);
        const px = CX + rb * Math.cos(a);
        const py = CY + rb * Math.sin(a);
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(170, 210, 255, 0.55)";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    function drawNucleus() {
      const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 38);
      grad.addColorStop(0, "rgba(255, 255, 255, 1)");
      grad.addColorStop(0.25, "rgba(210, 240, 255, 0.95)");
      grad.addColorStop(0.55, "rgba(80, 160, 230, 0.35)");
      grad.addColorStop(1, "rgba(10, 20, 40, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(CX, CY, 38, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.font = "600 13px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("O", CX, CY - 5);
      ctx.font = "400 9px Segoe UI, sans-serif";
      ctx.fillStyle = "rgba(200,230,255,0.85)";
      ctx.fillText("Z=8", CX, CY + 9);
    }

    function drawElectronNodes() {
      const shellR = 2.05 * A0 * 3.8;
      const centers = seedCenters(shellR);
      const nodes = [
        { label: "1s", x: 0, y: 0, dim: false },
        { label: "2s", x: shellR * 0.35, y: 0, dim: false },
        { label: "2px", x: shellR * 0.65, y: 0, dim: false },
        { label: "2py", x: 0, y: -shellR * 0.65, dim: false },
        { label: "2pz", x: shellR * 0.46, y: -shellR * 0.46, dim: true },
      ];

      for (const node of nodes) {
        const px = CX + node.x;
        const py = CY + node.y;
        const r = node.dim ? 3.5 : 4.5;
        const alpha = node.dim ? 0.45 : 0.85;
        ctx.fillStyle = `rgba(180, 230, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // FOL intersection highlights
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      for (let i = 1; i < centers.length; i++) {
        for (let j = i + 1; j < centers.length; j++) {
          const [x1, y1] = centers[i];
          const [x2, y2] = centers[j];
          const mx = (x1 + x2) / 2;
          const my = (y1 + y2) / 2;
          ctx.beginPath();
          ctx.arc(CX + mx, CY + my, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawLabels() {
      ctx.fillStyle = "rgba(140, 180, 210, 0.5)";
      ctx.font = "400 10px Segoe UI, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("K: 1s\u00B2", 24, H - 48);
      ctx.fillText("L: 2s\u00B2 2p\u2074", 24, H - 30);
      ctx.textAlign = "right";
      ctx.fillText("unpaired 2pz \u2192 dipole", W - 24, H - 30);
    }

    // Render order
    ctx.fillStyle = "#030308";
    ctx.fillRect(0, 0, W, H);
    renderDensity();
    drawSacredGeometry();
    drawNucleus();
    drawElectronNodes();
    drawLabels();
  </script>
</body>
</html>
